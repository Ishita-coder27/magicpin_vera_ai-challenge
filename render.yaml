services:
  - type: web
    name: vera-decision-engine
    runtime: python
    plan: free
    buildCommand: pip install fastapi "uvicorn[standard]" pydantic anthropic
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODE
        value: challenge
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
